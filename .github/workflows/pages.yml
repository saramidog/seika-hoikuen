name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 公式ActionsはコミットSHAで固定。更新は Dependabot のPRで確認する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 公開するのはサイトの表示に使うファイルだけ。
      # _work/（作業用の元画像）、docs/（園内資料）、CLAUDE.md などは公開しない。
      - name: Collect public files
        run: |
          mkdir _site
          cp -- *.html *.css *.js CNAME robots.txt sitemap.xml _site/
          cp -R -- images fonts _site/

      - name: Check links in public files
        run: python3 .github/scripts/check-site.py _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
